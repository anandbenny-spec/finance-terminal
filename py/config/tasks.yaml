# Source of truth for what runs when (Architecture 02 §1.3). Each run upserts this into ops.task (ft/jobs/config.py).
# Per task: description, workflows (workflow: due rule), run_after, overdue_after, and optionally uses_nse,
# visitor_refreshable and enabled (default true). Due rules: `every <n> minutes|hours|days`, fomc_decision_day,
# mpc_decision_day, after_decision_document (ft/jobs/due.py). Each task needs at least one `every` rule.
# A decision-day rule is due inside the meeting's watch window; once the window has closed it stays due as a
# *catch-up* while the decision document (or, for after_decision_document, the AI step) is missing, until the end of
# the next calendar day in the bank's zone. A daily rule may add that catch-up: `every 16 hours or fomc_catch_up`
# (also mpc_catch_up, ai_catch_up) is due after 16 hours, or while the named rule's catch-up applies (ft/jobs/config.py).
policy.calendar:
  description: FOMC and MPC meeting calendars
  workflows: {weekly: every 25 days}
  overdue_after: 40 days
policy.fed_documents:
  description: FOMC statements, minutes, press-conference transcripts
  workflows: {daily: every 16 hours or fomc_catch_up, watch: fomc_decision_day}
  run_after: [policy.calendar]
  overdue_after: 3 days
policy.rbi_documents:
  description: MPC resolutions, Governor's statements, minutes, transcripts (old site + RSS)
  workflows: {daily: every 16 hours or mpc_catch_up, watch: mpc_decision_day}
  run_after: [policy.calendar]
  overdue_after: 3 days
policy.market_series:
  description: FRED and yfinance series for the policy tracker and ticker tape
  # every 8 hours (issue #105): due at both daily runs, 06:37 IST (14 h after the evening run) and the weekday
  # 16:37 IST run (10 h after the morning one). Every other daily task keeps 20 hours, so the evening run skips it.
  workflows: {daily: every 8 hours}
  overdue_after: 4 days
policy.reactions:
  description: Market reactions around each decision
  workflows: {daily: every 16 hours}
  run_after: [policy.market_series, policy.fed_documents, policy.rbi_documents]
  overdue_after: 4 days
policy.ai_batch:
  description: Summaries, diffs, stance, scores and projections for new documents
  workflows: {daily: every 16 hours or ai_catch_up, watch: after_decision_document}
  run_after: [policy.fed_documents, policy.rbi_documents]
  overdue_after: 3 days
policy.rate_cycles:
  description: Each bank's easing and tightening cycles, derived from its stored rate decisions
  workflows: {daily: every 16 hours}
  run_after: [policy.fed_documents, policy.rbi_documents]
  overdue_after: 3 days
site.quality_summary:
  description: The accuracy page's counts by module and period, projected from the site's own records (AI outputs, loads, freshness, drills, gates, held-back fields)
  workflows: {daily: every 16 hours}
  run_after: [policy.calendar, policy.fed_documents, policy.rbi_documents, policy.market_series, policy.reactions, policy.rate_cycles, policy.ai_batch]
  overdue_after: 3 days
crypto.coingecko_markets:
  description: CoinGecko daily market snapshot, top 500 (stored, unpublished)
  workflows: {daily: every 16 hours}
  overdue_after: 3 days
equity.universe:
  description: Company master, Nifty index membership and curated peer groups (Nifty 50 universe)
  workflows: {weekly: every 6 days}
  overdue_after: 10 days
  uses_nse: true
equity.valuation_inputs:
  description: Damodaran's implied ERP, India's default spread and country risk premium and industry betas; the IMF's India growth and inflation (valuation engine inputs)
  workflows: {weekly: every 6 days}
  overdue_after: 40 days
equity.prices:
  description: Daily prices of the universe companies from the exchanges' bhavcopies, NSE first
  workflows: {weekly: every 6 days}
  run_after: [equity.universe]
  overdue_after: 10 days
  uses_nse: true
equity.filings:
  description: Quarterly results XBRL filings of the universe companies (consolidated and standalone), registered as documents with their results announcement events
  workflows: {weekly: every 6 days}
  run_after: [equity.universe]
  overdue_after: 10 days
  uses_nse: true
equity.corporate_actions:
  description: Corporate actions of the universe companies from the exchange's record, with each split, bonus, demerger and rights issue's price adjustment factor, checked against the prices before it is applied
  workflows: {weekly: every 6 days}
  run_after: [equity.prices]
  overdue_after: 10 days
  uses_nse: true
equity.statements:
  description: Statements parsed from the stored results XBRL filings (quarter, year to date and balance sheet), each filing checked before its figures are stored
  workflows: {weekly: every 6 days}
  run_after: [equity.filings]
  overdue_after: 10 days
  uses_nse: false
equity.shareholding:
  description: Quarterly shareholding patterns of the universe companies from the exchange's XBRL, with each company's promoter and promoter-group holding
  workflows: {weekly: every 6 days}
  run_after: [equity.universe]
  overdue_after: 100 days
  uses_nse: true
equity.brsr:
  description: Each universe company's BRSR filings (FY 2023-24 on) from the exchanges' XBRL, with the value chain card's values, products and group companies, each year from its own filing and restatements flagged
  workflows: {weekly: every 6 days}
  run_after: [equity.universe]
  overdue_after: 10 days
  uses_nse: true
equity.related_parties:
  description: Each universe company's related-party transactions and segment revenue for its latest fiscal year, read from the stored results filings, for the value chain card
  workflows: {weekly: every 6 days}
  run_after: [equity.filings]
  overdue_after: 10 days
  uses_nse: false
equity.segment_changes:
  description: Each India company's reportable segments over its latest six quarters, read from the stored consolidated results filings, and the flags where a segment of the previous four quarters is missing from the latest (dropped, merged, renamed)
  workflows: {weekly: every 6 days}
  run_after: [equity.statements]
  overdue_after: 10 days
  uses_nse: false
equity.kpi_tables:
  # The KPI-table pilot (DD-04, #512; Plan 05 §1.3). Hand-run only: the task's due() refuses the daily, weekly and watch
  # workflows (no schedule before 18 Nov, card), so the `weekly` rule here only satisfies config's "one every rule"; the
  # dev run and the one production run (DD-06) are started by hand with backfill --task equity.kpi_tables
  # (refresh's 30-minute job timeout is too short for the run's page calls).
  description: The KPI-table pilot (7 IT and bank companies, Q3 FY25 to Q2 FY27) — the results press release, fact sheet or data sheet found in the announcements feed, read and not stored, its KPI metrics extracted per page through Haiku and written kept or filtered; shows nothing until DD-07's judge
  workflows: {weekly: every 6 days}
  run_after: [equity.universe]
  overdue_after: 10 days
  uses_nse: true
equity.metrics:
  description: Derived metrics of the universe companies (TTM figures, margins, returns, growth, banks' ratios and market multiples) from the stored statements, prices and corporate actions, each with its inputs or the reason it is held back
  workflows: {weekly: every 6 days}
  run_after: [equity.statements, equity.corporate_actions, equity.shareholding]
  overdue_after: 10 days
  uses_nse: false
equity.beta:
  description: Regression beta (104 weekly returns against the Nifty 50) and Damodaran's bottom-up beta relevered at market debt to equity, for the universe companies
  workflows: {weekly: every 6 days}
  run_after: [equity.metrics, equity.valuation_inputs, policy.market_series]
  overdue_after: 10 days
  uses_nse: false
equity.rate_reactions:
  description: Every universe company's and the Nifty 50's move on each MPC and FOMC rate decision since 2019 (one and five sessions) and over each rate cycle, with the pairs left out counted
  workflows: {weekly: every 6 days}
  run_after: [equity.corporate_actions, policy.rate_cycles, policy.market_series]
  overdue_after: 10 days
  uses_nse: false
equity.results_reactions:
  description: Each company's and the Nifty 50's move (one and five sessions) around every results filing since 2025, with the windows left out counted
  workflows: {weekly: every 6 days}
  run_after: [equity.filings, equity.corporate_actions, policy.market_series]
  overdue_after: 10 days
  uses_nse: false
equity.valuation:
  description: Each universe company's valuation runs (reverse DCF and default DCF for operating companies, implied return on equity for lenders, a not-applicable lead run for insurers and mixed companies) and the stored scenario grid
  workflows: {weekly: every 6 days}
  run_after: [equity.beta]
  overdue_after: 10 days
  uses_nse: false
equity.snapshot:
  description: The weekly screener snapshot, one row per universe company with its figures, held-back reasons and labels, kept so multiples' history builds up
  workflows: {weekly: every 6 days}
  run_after: [equity.valuation]
  overdue_after: 10 days
  uses_nse: false
equity.call_transcripts:
  description: Earnings-call transcript filings and call intimations of the universe companies over the last two seasons, found in NSE's announcements (BSE as the fallback) and classified, then fetched once each, the PDF classified, a cover letter's links followed, the text read with each page's range, and every processed call written as an unpublished earnings_call row
  workflows: {weekly: every 6 days}
  run_after: [equity.universe, equity.filings]
  overdue_after: 10 days
  uses_nse: true
equity.call_text:
  description: Turns, sections and speaker roles of each stored earnings-call transcript by rules with no AI, then its chunks, and the publication of the call (the transcript document's metadata only, its text stays private)
  workflows: {weekly: every 6 days}
  run_after: [equity.call_transcripts, equity.filings]
  overdue_after: 10 days
  uses_nse: false
equity.calls_ai:
  description: The cited summary of each stored earnings call (what management said, what analysts asked about), precomputed through the Batch API; skips with a warning when AI is unavailable (no key, no credit, the budget switch, ai=off) and sends nothing then
  workflows: {weekly: every 6 days}
  run_after: [equity.call_text]
  overdue_after: 10 days
  uses_nse: false
equity.guidance_scores:
  description: Each management guidance target from the earnings calls scored against the company's filed figures (delivered, missed, pending or not scored, with its relation and inputs), and the guidance forecast series, with no AI
  workflows: {weekly: every 6 days}
  run_after: [equity.calls_ai, equity.metrics]
  overdue_after: 10 days
  uses_nse: false
equity.call_scores:
  description: What changed in each earnings call's opening remarks since the previous quarter's call (similarity with numbers masked, the five most-changed sentence pairs, rewritten openings and new speakers), with no AI; the tone scores join this task later
  workflows: {weekly: every 6 days}
  run_after: [equity.calls_ai]
  overdue_after: 10 days
  uses_nse: false
us.universe:
  description: The Dow 30's company master (curated, unpublished until the US slice goes live), Dow membership and US peer groups, checked against SEC's submissions
  workflows: {weekly: every 6 days}
  overdue_after: 10 days
  uses_nse: false
us.prices:
  description: Daily prices of the Dow 30 from Yahoo Finance since 2019, each day's price as traded (unpublished until the US slice goes live)
  workflows: {weekly: every 6 days}
  run_after: [us.universe]
  overdue_after: 10 days
  uses_nse: false
us.corporate_actions:
  description: Splits and dividends of the Dow 30 from Yahoo Finance, with each split's price adjustment factor checked against the stored prices before it is applied
  workflows: {weekly: every 6 days}
  run_after: [us.prices]
  overdue_after: 10 days
  uses_nse: false
us.filings:
  description: The Dow 30's statements from SEC EDGAR's company facts (each 10-K and 10-Q registered with its quarter, year to date and balance sheet, checked before its figures are stored), unpublished until the US slice goes live
  workflows: {weekly: every 6 days}
  run_after: [us.universe]
  overdue_after: 10 days
  uses_nse: false
us.valuation_inputs:
  description: Damodaran's US industry betas and the IMF's US growth and inflation, the US slice's valuation inputs that India's inputs task doesn't store (the 10-year Treasury and the implied ERP are read where they are stored)
  workflows: {weekly: every 6 days}
  overdue_after: 40 days
  uses_nse: false
us.metrics:
  description: Derived metrics of the Dow 30 (TTM figures, margins, returns, growth and market multiples) from the stored SEC statements, prices and corporate actions, with operating income as filed for EBIT, each with its inputs or the reason it is held back
  workflows: {weekly: every 6 days}
  run_after: [us.filings, us.corporate_actions]
  overdue_after: 10 days
  uses_nse: false
us.beta:
  description: Regression beta (104 weekly returns against the S&P 500) and Damodaran's US bottom-up beta relevered at market debt to equity, for the Dow 30
  workflows: {weekly: every 6 days}
  run_after: [us.metrics, us.valuation_inputs, policy.market_series]
  overdue_after: 10 days
  uses_nse: false
us.valuation:
  description: Each Dow 30 company's valuation runs in dollars (reverse DCF and default DCF for operating companies, implied return on equity for lenders, a not-applicable lead run for insurers and mixed companies) and the stored scenario grid
  workflows: {weekly: every 6 days}
  run_after: [us.beta]
  overdue_after: 10 days
  uses_nse: false
us.snapshot:
  description: The weekly screener snapshot of the Dow 30, one row per company with its figures, held-back reasons and labels, kept so multiples' history builds up (unpublished until the US slice goes live)
  workflows: {weekly: every 6 days}
  run_after: [us.valuation]
  overdue_after: 10 days
  uses_nse: false
