# Source of truth for what runs when (Architecture 02 §1.3). Each run upserts this into ops.task (ft/jobs/config.py).
# Per task: description, workflows (workflow: due rule), run_after, overdue_after, and optionally uses_nse,
# visitor_refreshable and enabled (default true). Due rules: `every <n> minutes|hours|days`, fomc_decision_day,
# mpc_decision_day, after_decision_document (ft/jobs/due.py). Each task needs at least one `every` rule.
policy.calendar:
  description: FOMC and MPC meeting calendars
  workflows: {weekly: every 25 days}
  overdue_after: 40 days
policy.fed_documents:
  description: FOMC statements, minutes, press-conference transcripts
  workflows: {daily: every 20 hours, watch: fomc_decision_day}
  run_after: [policy.calendar]
  overdue_after: 3 days
policy.rbi_documents:
  description: MPC resolutions, Governor's statements, minutes, transcripts (old site + RSS)
  workflows: {daily: every 20 hours, watch: mpc_decision_day}
  run_after: [policy.calendar]
  overdue_after: 3 days
policy.market_series:
  description: FRED and yfinance series for the policy tracker and ticker tape
  workflows: {daily: every 20 hours}
  overdue_after: 4 days
policy.reactions:
  description: Market reactions around each decision
  workflows: {daily: every 20 hours}
  run_after: [policy.market_series, policy.fed_documents, policy.rbi_documents]
  overdue_after: 4 days
policy.ai_batch:
  description: Summaries, diffs, stance, scores and projections for new documents
  workflows: {daily: every 20 hours, watch: after_decision_document}
  run_after: [policy.fed_documents, policy.rbi_documents]
  overdue_after: 3 days
crypto.coingecko_markets:
  description: CoinGecko daily market snapshot, top 500 (stored, unpublished)
  workflows: {daily: every 20 hours}
  overdue_after: 3 days
equity.universe:
  description: Company master, Nifty index membership and curated peer groups (Nifty 50 universe)
  workflows: {weekly: every 6 days}
  overdue_after: 10 days
  uses_nse: true
equity.valuation_inputs:
  description: Damodaran's implied ERP, India's default spread and country risk premium and industry betas; the IMF's India growth and inflation (valuation engine inputs)
  workflows: {weekly: every 6 days}
  overdue_after: 40 days
equity.prices:
  description: Daily prices of the universe companies from the exchanges' bhavcopies, NSE first
  workflows: {weekly: every 6 days}
  run_after: [equity.universe]
  overdue_after: 10 days
  uses_nse: true
