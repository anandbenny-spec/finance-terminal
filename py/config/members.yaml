# The RBI's Monetary Policy Committee (B6 part 1, 23 Oct 2026): every member of every meeting from the Dec 2018
# baseline (no. 14) to Oct 2026 (no. 63), drafted from the attendance paragraph (para 2) of the 49 minutes saved in
# app/data/fixtures/rbi/ (no. 39, the special meeting of 3 Nov 2022, has no minutes). Each minutes names the six
# members with their roles: the Governor (the chair), the Deputy Governor in charge of monetary policy, the Executive
# Director nominated by the Central Board (RBI Act s.45ZB(2)(c)) and three external members. All six vote.
# A term here spans the meetings a member attended in that role, from the first meeting's first day to the last
# meeting's last day (open while they sat at the latest meeting), so it isn't the appointment's dates: those come
# from the appointment notices if a check ever needs them. Names are written without their title (Dr., Prof., Shri,
# Smt.), which ft/policy/members.py strips from the documents' names before matching.
rbi:
  chetan-ghate:
    name: Chetan Ghate
    terms:
      - role: mpc_external_member
        affiliation: Professor, Indian Statistical Institute
        voter: true
        from: 2018-12-03
        to: 2020-08-06
        source: "MPC minutes, para 2 (attendance): external member, meetings nos. 14-24 (3 Dec 2018 to 6 Aug 2020, 11 meetings); the roster starts at the Dec 2018 baseline, not at the start of the term"
