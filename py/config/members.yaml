# Rosters (Spec 01 D12): who sits on each committee, in what role, and when they vote. Read by ft/policy/members.py
# and loaded into policy.member and policy.member_term on every policy.fed_documents run. Anand spot-checks.
#
# Per person: name (as the statements write it), aliases (other spellings in the documents) and dated terms, each with
# role, affiliation, voter (FOMC voting member), from, to (the last day, inclusive; absent = open) and a source note.
# Roles as the FOMC lists them: fed_chair (the Board's Chair, the Committee's chair); fed_vice_chair (the Committee's
# vice chair, the New York Fed's president); fed_governor (other Board members, including the Board's Vice Chair and
# Vice Chair for Supervision); fed_bank_president (the other Reserve Bank presidents).
# A president's voting status changes on the day the Committee's term for the year begins (the January meeting's first
# day: "Annual Organizational Matters" in that meeting's minutes), so each voting year is its own term. An alternate who
# votes in a member's place keeps voter: false (the statement says "X voted as an alternate member").
#
# Coverage (B5 part 1, 23 Oct 2026): everyone who voted at an FOMC meeting from the 2025 organizational meeting
# (28 Jan 2025) on, with terms from that date. The 2019-2024 voters and their earlier terms come with B5 part 2.
# Checked against: the Board's membership list (federalreserve.gov/aboutthefed/bios/board/boardmembership.htm, read
# 23 Oct 2026); the minutes of 28-29 Jan 2025 and 27-28 Jan 2026 (Annual Organizational Matters; saved in
# app/data/fixtures/fed/); and each Reserve Bank's announcement, cited per person.

