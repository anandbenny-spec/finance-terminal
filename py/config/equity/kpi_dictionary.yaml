          - {label: it services attrition, seen: "11h1.....", why: "the same LTM IT-services attrition rate, printed without 'LTM' in the highlights"}
          - {label: ltm attrition it services, seen: "..h....1.", why: "the same rate with its words reordered (Q1 FY27)"}
        terms: [attrition]
      - key: women_share
        name: Women in the workforce
        measure: [percent]
        unit: "%"
        labels:
          - {label: women in the workforce, seen: "11h......"}
          - {label: women, seen: "1.h......", why: "the same share, printed as 'Women' beside the workforce figure"}
        terms: [women, gender, diversity]
      - key: patents_applied_quarter
        name: Patents applied for in the quarter
        measure: [count]
        unit: patents
        labels:
          - {label: patents applied during the quarter, seen: "11h11..11"}
          - {label: applied during the quarter patents, seen: "..h..1...", why: "the same quarterly count with its words reordered (Q3 FY26)"}
        terms: [patent]
      - key: patents_granted_quarter
        name: Patents granted in the quarter
        measure: [count]
        unit: patents
        labels:
          - {label: patents granted during the quarter, seen: "11h11..11"}
          - {label: granted during the quarter patents, seen: "..h..1...", why: "the same quarterly count with its words reordered (Q3 FY26)"}
        terms: [patent]
      - key: patents_applied_cumulative
        name: Patents applied for, cumulative
        measure: [count]
        unit: patents
        labels:
          - {label: patents applied, seen: "1.h1....."}
          - {label: patents applied for, seen: ".1h.1....", why: "the same cumulative count ('has applied for … patents'); the quarter's own count is 'during the quarter'"}
          - {label: applied for patents, seen: "..h..1...", why: "the same cumulative count with its words reordered (Q3 FY26)"}
          - {label: patents filed cumulative, seen: "..h...1..", why: "the same cumulative count, labelled 'filed' and 'cumulative' from Q4 FY26"}
          - {label: applied for patents cumulative, seen: "..h....1.", why: "the same cumulative count (Q1 FY27 wording)"}
          - {label: patents applied for cumulative as of september, seen: "..h.....1", why: "the same cumulative count, with its as-of date (Q2 FY27)"}
        terms: [patent]
      - key: patents_granted_cumulative
        name: Patents granted, cumulative
        measure: [count]
        unit: patents
        labels:
          - {label: patents granted, seen: "11h11...."}
          - {label: granted patents, seen: "..h..1...", why: "the same cumulative count with its words reordered (Q3 FY26)"}
          - {label: patents granted cumulative, seen: "..h...1..", why: "the same cumulative count, labelled 'cumulative' from Q4 FY26"}
          - {label: granted patents cumulative, seen: "..h....1.", why: "the same cumulative count (Q1 FY27 wording)"}
          - {label: patents granted cumulative as of september, seen: "..h.....1", why: "the same cumulative count, with its as-of date (Q2 FY27)"}
        terms: [patent]
      - key: industry_share
        name: Revenue share by industry
        measure: [percent]
        unit: "%"
        members:
          bfsi: BFSI
          consumer business: Consumer Business
          life sciences and healthcare: Life Sciences and Healthcare
          manufacturing: Manufacturing
          technology and services: Technology and Services
          communication and media: Communication and Media
          energy resources and utilities: Energy, Resources and Utilities
          regional markets and others: Regional Markets and Others
        labels:
          - {label: industry composition, seen: "..h11..1."}
          - {label: composition q fy, seen: "11h......", why: "the same industry table, titled 'Composition (%) Q2 FY25'; the industry members tell it from the geography table"}
          - {label: industry composition q fy, seen: "..h..1...", why: "the same table with its quarter in the title (Q3 FY26)"}
          - {label: vertical q fy, seen: "..h...1..", why: "the same table titled by vertical (Q4 FY26)"}
          - {label: composition, seen: "..h.....1", why: "the same table titled 'Composition (%)' (Q2 FY27); the industry members tell it from the geography table"}
        terms: [revenue share, share of revenue, contribution]
      - key: geography_share
        name: Revenue share by geography
        measure: [percent]
        unit: "%"
        members:
          north america: North America
          latin america: Latin America
          uk: UK
          continental europe: Continental Europe
          india: India
          asia pacific: Asia Pacific
          mea: Middle East and Africa
        aliases:
          middle east and africa: mea
        labels:
          - {label: geography composition, seen: "..h11...."}
          - {label: composition q fy, seen: "11h......", why: "the same geography table, titled 'Composition (%) Q2 FY25'; the geography members tell it from the industry table"}
          - {label: geography composition q fy, seen: "..h..1...", why: "the same table with its quarter in the title (Q3 FY26)"}
          - {label: geography q fy, seen: "..h...1..", why: "the same table titled by geography (Q4 FY26)"}
          - {label: composition, seen: "..h....11", why: "the same table titled 'Composition (%)' (Q1 and Q2 FY27); the geography members tell it from the industry table"}
        terms: [revenue share, share of revenue, contribution]
      - key: cc_growth_qoq_industry
        name: Revenue growth, QoQ, constant currency, by industry
        measure: [percent_change]
        unit: "%"
        members:
          bfsi: BFSI
          consumer business: Consumer Business
          life sciences and healthcare: Life Sciences and Healthcare
          manufacturing: Manufacturing
          technology and services: Technology and Services
          communication and media: Communication and Media
          energy resources and utilities: Energy, Resources and Utilities
          regional markets and others: Regional Markets and Others
        aliases:
          tss: technology and services
          cmi: communication and media
          cbg: consumer business
          consumer business group: consumer business
          eru: energy resources and utilities
        labels:
          - {label: q o q cc growth, seen: "..h.11111"}
          - {label: qoq cc, seen: "..h.1....", why: "the same growth in the highlights ('BFSI (+…% QoQ CC)'), the member taken out of the label"}
          - {label: growth qoq cc, seen: "..h.....1", why: "the same growth (Q2 FY27 highlights wording)"}
          - {label: growth led by qoq in cc, seen: "..h...1..", why: "the same growth in the Q4 FY26 highlights ('growth led by CBG … QoQ in CC')"}
          - {label: growth led by, seen: ".1h......", why: "the same growth in the Q3 FY25 highlights ('growth led by Consumer Business Group')"}
        terms: [growth, grew, constant currency]
      - key: cc_growth_qoq_geography
        name: Revenue growth, QoQ, constant currency, by geography
        measure: [percent_change]
        unit: "%"
        members:
          north america: North America
          latin america: Latin America
          uk: UK
          continental europe: Continental Europe
          india: India
          asia pacific: Asia Pacific
          mea: Middle East and Africa
          international: International
        aliases:
          middle east and africa: mea
        labels:
          - {label: q o q cc growth, seen: "..h..1111"}
          - {label: qoq in cc, seen: "..h...1..", why: "the same growth in the Q4 FY26 highlights ('North America … QoQ in CC'), the member taken out"}
          - {label: growth led by qoq in cc, seen: "..h...1..", why: "the same growth in the Q4 FY26 highlights ('growth led by UK … QoQ in CC')"}
          - {label: international revenue grows qoq in constant currency, seen: "..h.1....", why: "the international markets' growth in the highlights (member International)"}
          - {label: international revenue qoq in constant currency, seen: "..h.....1", why: "the same international growth (Q2 FY27 wording)"}
        terms: [growth, grew, constant currency]
      - key: cc_growth_qoq
        name: Revenue growth, QoQ, constant currency
        measure: [percent_change]
        unit: "%"
        labels:
          - {label: q o q cc growth, seen: "..h.1..1."}
          - {label: growth qoq in cc, seen: "..h...111", why: "the same company growth in the highlights ('… growth QoQ in CC')"}
          - {label: total q o q cc growth, seen: "..h..11..", why: "the same company growth, the table's total row"}
          - {label: sequential growth in constant currency, seen: "..h.1....", why: "the same company growth (Q2 FY26 highlights: 'Sequential growth … in Constant Currency')"}
        terms: [constant currency, sequential growth]
      - key: tcv
        name: Total contract value
        measure: [amount]
        unit: US$ billion
        labels:
          - {label: q total contract value tcv, seen: "..h.1..1."}
          - {label: tcv for q, seen: "..h...1..", why: "the same quarter's order book (TCV), Q4 FY26 wording"}
        terms: [tcv, total contract value, order book, deal wins]
      - key: ai_revenue_annualised
        name: Annualised AI revenue
        measure: [amount]
        unit: US$ billion
        labels:
