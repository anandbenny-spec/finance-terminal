# The KPI-table pilot's per-company dictionary (DD-05, #513; Plan 05 §1.3 "a per-company dictionary of names"; Data Audit
# 10 §8 finding 3). Labelled curated: written by the lane D build session (Opus 5.5) on Sat 14 Nov 2026 from dev run 12's
# extracted labels (#512: ops.task_run 261, 51 read documents, 3,556 kept rows), read through the read-only dev connector.
# Read by ft/equity/kpi/dictionary.py, which maps each kept `equity.kpi_value` row to one metric key or to none.
#
# How a row maps (ft/equity/kpi/dictionary.py):
#   - a label is normalised: lower case, "&" read as "and", every run of non-letters (digits, signs, brackets, "%") a
#     space, "q o q" read as "qoq" and "y o y" as "yoy", and the stray tokens "q", "fy", "h" and "s" (a "Q2 FY26" stamp,
#     "H1", a possessive) dropped. So "Q-o-Q CC Growth (%)" and "q o q cc growth" are one label;
#   - the row's member is normalised the same way (and through the metric's `aliases`), and its words are taken out of
#     the label once, so "Geography Composition (%): UK" with member "UK" reads as "geography composition";
#   - the row maps to the metric whose `labels` (normalised the same way, the member taken out likewise) hold that label,
#     whose `measure` holds the row's measure, and whose members hold the row's member: `members` (each member its own
#     key, `<key>.<member>`, the empty member "" the total) or `member` (the members the one key accepts; default "");
#   - no metric: the row is unmapped (`dict_key` stays null) and never makes or answers a flag. Two metrics of a company
#     can't share a label, member and measure (a test checks), so a row maps to at most one.
#
# Each label carries `seen`: where dev run 12 had it, one character per document in the company's `quarters` order
# ("1" present, "." absent, "h" held), so a rename shows in the file. Every label after a metric's first is a merge, and
# its `why` says why it is the same metric. Values are never in this file (CLAUDE.md §1, NSE posture).
# `unit` is the curated unit kind that rule 4 compares ("renamed or redefined": a dropped metric and a new one with the
# same unit in the same quarter). `terms` are the words that name the metric when management or an analyst speaks of
# it on the call: the candidates for "reason stated" and "an analyst asked" (a member metric's sentence must also name
# its member, or one of its aliases).
version: 1
companies:
  tcs:
    document_class: press_release
    quarters: [Q2 FY25, Q3 FY25, Q4 FY25, Q1 FY26, Q2 FY26, Q3 FY26, Q4 FY26, Q1 FY27, Q2 FY27]
    metrics:
      - key: workforce
        name: Workforce
        measure: [people]
        unit: people
        labels:
          - {label: workforce strength, seen: "11h....1."}
          - {label: workforce, seen: "1.h......", why: "the same closing headcount, printed as 'Workforce' in the highlights"}
          - {label: employee headcount, seen: "..h...1..", why: "the same closing headcount under the Q4 FY26 wording"}
        terms: [workforce, headcount, head count]
      - key: attrition_ltm
        name: Attrition, LTM, IT services
        measure: [percent]
        unit: "%"
        member: ["", it services]
