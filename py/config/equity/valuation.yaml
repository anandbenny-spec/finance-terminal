# Valuation engine settings (Spec 02A §5; started by 2A-12, which needs only the tax rate; 2A-13 adds the rest).
#
# india_marginal_tax_rate: the rate that relevers Damodaran's unlevered industry beta at a company's market debt to
# equity (Spec 02A §5.8): beta = unlevered x (1 + (1 - rate) x D/E). 25.168% is the new-regime corporate rate of 22%
# plus the 10% surcharge and 4% cess (22 x 1.10 x 1.04 = 25.168%). Brief §6.3; Data Audit 02 E8.
india_marginal_tax_rate:
  rate: 0.25168
  source: Income-tax Act 2025, section 200 (the 22% rate), with the 10% surcharge and 4% cess; Data Audit 02 E8
  in_force: 2026-04-01      # the Income-tax Act 2025's commencement (section 115BAA's rate before it); 2A-13

# The DCF engine's settings (Spec 02A §5.7; job 2A-13), read by ft/equity/assemble.py into the engine's Settings. Not
# market-specific: the engine (ft/equity/valuation/) is market-agnostic, and the EDGAR test runs it with these too.
# Rates are fractions.
model:
  cost_of_debt_spread:
    spread: 0.06
    source: >-
      Spec 02A §5.7 (28 Oct 2026): the pre-tax cost of debt is bounded to [the gross 10-year yield, that + 6 points];
      Data Audit 02 E7 (interest expense ÷ average debt)
  default_growth:
    low: -0.05
    high: 0.30
    source: Spec 02A §5.7 (28 Oct 2026), dcf_default at the 3-FY revenue CAGR clamped to -5% to 30%
  scenario_grid:
    growth: {from: -0.05, to: 0.30, step: 0.025}
    margin_steps: [-0.05, -0.025, 0, 0.025, 0.05]
    wacc_steps: [-0.02, -0.01, 0, 0.01, 0.02]
    source: >-
      Spec 02A §5.7 (28 Oct 2026): growth -5% to 30% in 2.5-point steps (15), the EBIT margin at its 3-FY level ± 2.5
      and ± 5 points (5; a margin ≤ 0 skipped), WACC ± 1 and ± 2 points (5): up to 375 values per company
  effective_tax:
    max: 0.50
    source: >-
      Spec 02A §5.7 (28 Oct 2026): the 3-FY effective rate gives way to the marginal rate when it's outside 0 to 50%
      or profit before tax is zero or negative; Brief §6.3 and Data Audit 02 E8 (effective rate to marginal rate)
  # The reverse DCF's near-cost case (Spec 02A §5.9; #354): a 3-FY return on capital above WACC by no more than this,
  # the model's value rising with growth and the price above its value at the range's top (+50%) is
  # `return_near_cost`, not `above_range`: at that return growth earns little more than it costs, so the model can't
  # reach the price, whatever the market expects. 2 points is the most the code accepts (#354's stop condition).
  near_cost_margin:
    margin: 0.01
    source: >-
      Anand, 10 Nov 2026, 12:30 IST (#354, option 1: 1.0 point, as the card proposed). Dev's run of 1 Nov 2026 (prices
      to 30 Oct 2026) had four companies in this case, 0.4 to 0.7 points above their WACC, all stored as above_range

# A lender's delivered return on equity, the figure its implied ROE is set against (Spec 02A §5.9; job 2A-14), read by
# ft/equity/assemble.py. The spec's window is five financial years, but results filings carry balance sheets only from
# March 2023 (banks' from March 2024; #114's finding), so average equity exists for fewer years: the average runs over
# the consecutive financial years, up to `years`, that end with the latest and have a stored return on equity, and is
# held back below `min_years`.
delivered_roe:
  years: 5
  min_years: 3
  source: >-
    Spec 02A §5.9 (the 5-FY average of PAT to owners ÷ average equity to owners); the window and the hold-back rule
    decided by Claude (standing delegation, 1 Nov 2026, #120), as Anand's note of 30 Oct 2026 on #120 asked (his
    example: "the average over the fiscal years with filed opening and closing equity, n shown, held back below 3
    years")

# The US slice's market parameters (Spec 02A.1 §5.4; job US-04, #403), read by ft/equity/us_inputs.py. The engine's
# `model` settings above apply to the US unchanged. Rates are fractions.
us:
  marginal_tax_rate:
    rate: 0.25
    source: >-
      US marginal rate: the federal 21% (26 USC §11(b)) plus state taxes, the 25% Damodaran uses for US companies
      (Data Audit 02 E8; Spec 02A.1 §5.4)
    in_force: 2018-01-01      # the Tax Cuts and Jobs Act's 21% federal rate, for tax years from 1 Jan 2018
  risk_free:
    series: fred.DGS10        # the 10-year Treasury yield at the price date (Data Audit 02 E2; Spec 02A.1 §5.4)
    netted: false
    source: >-
      Spec 02A.1 §5.4 asked whether Damodaran nets a US default spread from the USD risk-free rate as well as from the
      ERP. His files settle it: he does, and he adds it back. ERPbymonth.xlsx (the Oct 2026 file in the fixtures),
      sheet "Historical ERP": from 1 Jun 2025 ("updated growth and added default-adjusted riskfree rate") the sheet
      carries a "$ Riskfree Rate", the T.Bond rate less the US default spread (1 Oct 2026: 5.29% to 5.07%), and an
      "ERP (T12m) with adj riskfree rate" (3.92% against 3.70% on the T.Bond rate); the expected return is the same
      either way (8.99%). ctrypremJuly26.xlsx, sheet "ERPs by country": the mature-market premium 4.20% is the "Implied
      ERP for S&P 500 with adjusted dollar riskfree rate (for US Aa1 rating)", the US's own premium is 4.42%, and the
      United States row (Aa1) has a default spread and a country risk premium of 0.2186% each. So for a US company he
      uses the netted rate with the mature premium plus the US's 0.22% country premium. The spec's other two rules (the
      mature-market ERP, no country risk premium) with a netted rate would leave the spread out of the cost of equity
      altogether; the gross yield with the mature ERP gives his market cost of equity exactly at a beta of 1 (and
      differs from his by 0.22% x (1 - beta) otherwise). Decided by Claude (standing delegation, 12 Nov 2026, #403);
      the alternative is his method in full (the netted rate, and the mature ERP plus the US default spread as a
      country premium), which needs the US spread stored per ctryprem edition. The engine's EDGAR test made the same
      pairing (the T.Bond rate with the mature ERP; tests/equity_edgar.py, 1 Nov 2026).
  erp:
    series: damodaran.ERP_IMPLIED   # the implied mature-market premium of the latest month on or before the price date
    country_risk_premium: none
    source: Spec 02A.1 §5.4 (no country risk premium); Data Audit 02 E3
  betas:
    file: betas.xls           # Damodaran's US industries (us.valuation_inputs stores it in equity.industry_benchmark, market US)
    index: yf.^GSPC           # the regression beta's index (Spec 02A.1 §5.4)
