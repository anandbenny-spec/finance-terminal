# The Dow 30: the US slice's company master (Spec 02A.1 §5.1; job US-01, issue #400). Curated, and labelled curated.
# Loaded by the task us.universe (py/src/ft/jobs/tasks/equity_us_universe.py), which creates each company unpublished
# (core.entity market US, currency USD, slug us-<ticker>) and never publishes one: the go-live flip is Anand's SQL after
# US-08's judge passes the slice (Spec 02A.1 §3, §8). The file's bytes are stored as the Dow snapshot's raw file.
#
# The list: the audit kit's curated Dow 30 (config/curated/dow30.csv, verified 19 Oct 2026; Data Audit 02a finding 18),
# confirmed on 11 Nov 2026 against S&P Dow Jones Indices' press releases. The last change: Alphabet (GOOGL) in for
# Verizon, effective before the open on 29 Jun 2026, and Honeywell staying as Honeywell Technologies Inc. after the
# Honeywell Aerospace spin-off (release "Alphabet Set to Join and Honeywell International to Remain in Dow Jones
# Industrial Average", 23 Jun 2026: https://press.spglobal.com/2026-06-23-Alphabet-Set-to-Join-and-Honeywell-International-to-Remain-in-Dow-Jones-Industrial-Average).
# S&P Global's news release archive (press.spglobal.com, read 11 Nov 2026) lists no Dow Jones Industrial Average
# change from 4 Oct 2026 to its newest release, of 6 Nov 2026.
# A later change is a new `as_of` and a new snapshot; a company that leaves keeps its rows.
#
# Per company:
# - ticker, cik, exchange: from SEC's company_tickers_exchange.json (the fixture saved by the audit kit, Oct 2026);
#   the task checks each against SEC's submissions on every run (the ticker is blocking, the exchange a warning).
# - predecessor_ciks: CIKs whose filings hold the company's earlier history (curated; US-02 merges their facts).
#   Disney: The Walt Disney Company's filings up to its March 2019 reorganisation sit under CIK 1001039 (now TWDC
#   Enterprises 18 Corp., formerly WALT DISNEY CO/; EDGAR's filing header, read 11 Nov 2026).
# - fy_end_month: the month the fiscal year ends (a 52/53-week year ending in the first days of a month counts as the
#   month before). sic: SEC's Standard Industrial Classification code. Both were read from SEC's submissions for AAPL,
#   AMGN, GOOGL, JPM, MSFT, NVDA and WMT (Oct and 11 Nov 2026); the rest were entered by the build session from SEC's
#   company records as it knew them. The task checks every one against SEC on every run: a mismatch is a warning
#   naming the company, and the YAML is corrected from it (SHW: 2851 to SEC's 5200, from the first dev run's warning,
#   11 Nov 2026; #400, #402). Neither is shown to visitors.
# - peer_group: a key of us_peer_groups.yaml. valuation_family: lender (banks and card lenders), insurer, mixed (the
#   consolidated figures hold a material lending or insurance arm: valuation shows N/A), else operating; the note says why.
# - multi_class: more than one class of common stock on the cover page (US-02 sums the classes).
