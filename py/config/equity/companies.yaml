# Curated classification of the Nifty 50 companies (Spec 02A §4; job 2A-04), keyed by company slug (the lower-cased
# NSE symbol at creation, `&` as `-and-`; the slug never changes when the symbol does). Per company: its peer group
# (peer_groups.yaml), `valuation_family` (operating, lender, insurer or mixed) with a `family_note` giving the evidence,
# `fy_end_month` (all Nifty 50 companies report to 31 March) and, only if ever needed, `price_exchange` (NSE by default).
# Labelled curated. Drafted 28 Oct 2026 by a build session from the Nifty list's Industry column and public knowledge;
# the annual reports' subsidiary lists were not read, so every `mixed` and each judgement call is listed in 2A-04's
# handoff for Anand's spot check (Spec 02A §9.5 item 1).

