  # ---------------------------------------------------------------- round 4 test split: cross-currency
  - id: sql-r4-x01
    split: test
    family: cross_currency
    question: How does Infosys's profit after tax for its latest financial year compare with Microsoft's?
    answerable: true
    gold_sql: |
      select company, currency, pat
      from (select company, currency, pat, period_end, max(period_end) over (partition by company) as latest
            from company_financials
            where basis = 'consolidated' and period_kind = 'year' and pat is not null
              and (nse_symbol = 'INFY' or ticker = 'MSFT')) t
      where period_end = latest
    cross_currency: true
    ordered: false
    notes: Each company's latest annual profit for the period in its own currency; never a difference or ratio of the two.
  - id: sql-r4-x02
    split: test
    family: cross_currency
    question: Which trades at a higher trailing P/E, Asian Paints or Home Depot?
    answerable: true
    gold_sql: |
      select company, pe_ttm
      from company_valuations
      where nse_symbol = 'ASIANPAINT' or ticker = 'HD'
    cross_currency: true
    ordered: false
    notes: A multiple is currency-neutral, so the two may be compared.
  - id: sql-r4-x03
    split: test
    family: cross_currency
    question: What is the average one-year price return of the companies in each market?
    answerable: true
    gold_sql: |
      select market, round(avg(return_1y), 4) as avg_return_1y
      from company_valuations
      group by market
    cross_currency: true
    ordered: false
    notes: A return is a fraction (currency-neutral); one average per market, compared at four decimals.
  - id: sql-r4-x04
    split: test
    family: cross_currency
    question: Which company on the site has the largest market capitalisation?
    answerable: true
    gold_sql: |
      select company
      from (select company, rank() over (partition by market order by market_cap desc) as r
            from company_valuations
            where market_cap is not null) t
      where r = 1
    cross_currency: true
    ordered: false
    notes: INR and USD market values are never ranked together, so the largest in each market. Only the company is checked.
  - id: sql-r4-x05
    split: test
    family: cross_currency
    question: What is the combined latest annual revenue of TCS and Salesforce?
    answerable: true
    gold_sql: |
      select company, currency, revenue
      from (select company, currency, revenue, period_end, max(period_end) over (partition by company) as latest
            from company_financials
            where basis = 'consolidated' and period_kind = 'year' and revenue is not null
              and (nse_symbol = 'TCS' or ticker = 'CRM')) t
      where period_end = latest
    cross_currency: true
    ordered: false
    notes: INR and USD amounts are never added; each company's latest annual revenue in its own currency.
  - id: sql-r4-x06
    split: test
    family: cross_currency
    question: By what percent did the Sensex and the Dow change from their last close of 2024 to their last close of 2025?
    answerable: true
    gold_sql: |
      with c as (
        select series_name, date, value
        from market_daily
        where series_key in ('yf.^BSESN', 'yf.^DJI') and date >= date '2024-12-01' and date < date '2026-01-01'
      ), e as (
        select series_name, max(case when date < date '2025-01-01' then date end) as d0, max(date) as d1
        from c
        group by series_name
      )
      select e.series_name, round(100 * (c1.value / c0.value - 1), 2) as change_pct
      from e
      join c c0 on c0.series_name = e.series_name and c0.date = e.d0
      join c c1 on c1.series_name = e.series_name and c1.date = e.d1
    cross_currency: true
    ordered: false
    notes: Each index's percent change against its own close (currency-neutral); the two levels are never compared. Compared at two decimals.
  - id: sql-r4-x07
    split: test
    family: cross_currency
    question: Which has the higher EBIT margin, Larsen & Toubro or Caterpillar?
    answerable: true
    gold_sql: |
      select company, ebit_margin
      from company_valuations
      where nse_symbol = 'LT' or ticker = 'CAT'
    cross_currency: true
    ordered: false
    notes: A margin is currency-neutral, so the two may be compared.
  - id: sql-r4-x08
    split: test
    family: cross_currency
    question: Which five companies on the site trade at the highest EV/sales, highest first?
    answerable: true
    gold_sql: |
      select company, ev_sales
      from company_valuations
      where ev_sales is not null
      order by ev_sales desc
      limit 5
    cross_currency: true
    ordered: true
    notes: A multiple is currency-neutral and may be ranked across markets (no tie on dev).
  - id: sql-r4-x09
    split: test
    family: cross_currency
    question: How does Bharti Airtel's capital expenditure in its latest financial year compare with Verizon's?
    answerable: true
    gold_sql: |
      select company, currency, capex
      from (select company, currency, capex, period_end, max(period_end) over (partition by company) as latest
            from company_financials
            where basis = 'consolidated' and period_kind = 'year' and capex is not null
              and (nse_symbol = 'BHARTIARTL' or ticker = 'VZ')) t
      where period_end = latest
    cross_currency: true
    ordered: false
    notes: Each company's latest annual capital expenditure in its own currency; never a difference or ratio of the two.
