  - id: sql-r3-m01
    split: dev
    family: module1
    question: On which dates in 2020 did the Fed cut rates, and by how much?
    answerable: true
    gold_sql: |
      select meeting_date, policy_rate_change_bps
      from policy_meetings
      where bank = 'Fed' and status = 'held' and policy_rate_change_bps < 0
        and meeting_date >= date '2020-01-01' and meeting_date < date '2021-01-01'
    cross_currency: false
    ordered: false
    notes: Held decisions, the unscheduled March 2020 ones among them. The change is signed (negative = cut), as the chip sql-m01 reads it.
  - id: sql-r3-m02
    split: dev
    family: module1
    question: How many MPC meetings did the RBI hold in 2023?
    answerable: true
    gold_sql: |
      select count(*) as meetings
      from policy_meetings
      where bank = 'RBI' and status = 'held' and meeting_date >= date '2023-01-01' and meeting_date < date '2024-01-01'
    cross_currency: false
    ordered: false
    notes: Every held MPC meeting of the calendar year.
  - id: sql-r3-m03
    split: dev
    family: module1
    question: What was the repo rate after the RBI's last decision of 2019?
    answerable: true
    gold_sql: |
      select rbi_repo_pct
      from policy_meetings
      where bank = 'RBI' and status = 'held' and meeting_date >= date '2019-01-01' and meeting_date < date '2020-01-01'
      order by meeting_date desc
      limit 1
    cross_currency: false
    ordered: false
    notes: Percent, after the year's last held decision.
  - id: sql-r3-m04
    split: dev
    family: module1
    question: How many dissenting votes were cast at RBI MPC meetings in 2024?
    answerable: true
    gold_sql: |
      select count(*) as dissents
      from policy_votes
      where bank = 'RBI' and is_dissent and meeting_date >= date '2024-01-01' and meeting_date < date '2025-01-01'
    cross_currency: false
    ordered: false
    notes: One row per member per meeting, so a member who dissented on the rate and the stance counts once at that meeting.
  - id: sql-r3-m05
    split: dev
    family: module1
    question: What was the USD/INR exchange rate on 30 June 2025?
