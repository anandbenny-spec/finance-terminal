    cross_currency: true
    ordered: false
    notes: One median per market in its own currency, compared at two decimals; a median across INR and USD prices fails.
  - id: sql-r3-x05
    split: dev
    family: cross_currency
    question: How much more is Apple worth than Reliance by market capitalisation?
    answerable: true
    gold_sql: |
      select company, currency, market_cap
      from company_valuations
      where nse_symbol = 'RELIANCE' or ticker = 'AAPL'
    cross_currency: true
    ordered: false
    notes: A difference of USD and INR amounts is never computed; each market value in its own currency.
  - id: sql-r3-x06
    split: dev
    family: cross_currency
    question: Which fell more on its worst day in 2025, the Nifty 50 or the S&P 500?
    answerable: true
    gold_sql: |
      with d as (
        select series_name, date, value / lag(value) over (partition by series_key order by date) - 1 as change
        from market_daily
        where series_key in ('yf.^NSEI', 'yf.^GSPC') and date >= date '2024-12-01' and date < date '2026-01-01'
      )
      select series_name, round(100 * min(change), 2) as worst_day_pct
      from d
      where date >= date '2025-01-01'
      group by series_name
    cross_currency: true
    ordered: false
    notes: Each index's largest one-day fall in 2025 against its own previous close, in percent (currency-neutral); the two levels are never compared. Compared at two decimals.
  - id: sql-r3-x07
    split: dev
    family: cross_currency
    question: Compare the five-year revenue growth of Infosys and IBM.
    answerable: true
    gold_sql: |
      select company, revenue_cagr_5y
      from company_valuations
      where nse_symbol = 'INFY' or ticker = 'IBM'
    cross_currency: true
    ordered: false
    notes: Compound annual growth is currency-neutral.
  - id: sql-r3-x08
    split: dev
    family: cross_currency
    question: Rank the companies on the site by market capitalisation within each market.
    answerable: true
    gold_sql: |
      select company, market_rank
      from (select company, rank() over (partition by market order by market_cap desc nulls last) as market_rank
            from company_valuations) t
    cross_currency: true
    ordered: false
    notes: A rank within India and within the US (1 = the largest); market values in INR and USD are never ranked together. Only the rank is checked; a model may add the market and the value with its currency.
  - id: sql-r3-x09
    split: dev
    family: cross_currency
