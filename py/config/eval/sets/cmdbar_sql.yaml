  - id: sql-r3-x04
    split: dev
    family: cross_currency
    question: What is the median share price of the companies on the site?
    answerable: true
    gold_sql: |
      select market, currency, round(percentile_cont(0.5) within group (order by price)::numeric, 2) as median_price
      from company_valuations
