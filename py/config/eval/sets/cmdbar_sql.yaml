    gold_sql: |
      select company, currency, price
      from (select company, currency, price, rank() over (partition by market order by price desc) as r
            from company_valuations
            where price is not null) t
      where r = 1
    cross_currency: true
    ordered: false
    notes: The highest price within each market, in its own currency; prices in INR and USD are not ranked together.
  - id: sql-r2-x07
    split: dev
    family: cross_currency
    question: Which index rose more over the 12 months to its latest close, the Sensex or the Nasdaq Composite?
    answerable: true
    gold_sql: |
      with s as (
        select series_name, date, value, max(date) over (partition by series_name) as d1
        from market_daily
        where series_key in ('yf.^BSESN', 'yf.^IXIC')
      ), b as (
        select series_name, max(date) as d0 from s where date <= d1 - interval '1 year' group by series_name
      )
      select e.series_name, round(100 * (e.value / s0.value - 1), 2) as change_pct
      from s e
      join b on b.series_name = e.series_name
      join s s0 on s0.series_name = b.series_name and s0.date = b.d0
      where e.date = e.d1
    cross_currency: true
    ordered: false
    notes: Percent change is currency-neutral; the two levels are never compared. The start is the last close on or before the date a year before the latest close. Compared at two decimals.
  - id: sql-r2-x08
