      from (select company, currency, dividends_paid, period_end, max(period_end) over (partition by company) as latest
            from company_financials
            where basis = 'consolidated' and period_kind = 'year' and dividends_paid is not null
              and (nse_symbol = 'ITC' or ticker = 'KO')) t
      where period_end = latest
    cross_currency: true
    ordered: false
    notes: INR and USD amounts are never added; each company's latest annual dividends paid in its own currency.
