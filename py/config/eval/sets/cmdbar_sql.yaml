    question: What was the Fed's target range after its last decision of 2023?
    answerable: true
    gold_sql: |
      select fed_target_lower_pct, fed_target_upper_pct
      from policy_meetings
      where bank = 'Fed' and status = 'held' and meeting_date >= date '2023-01-01' and meeting_date < date '2024-01-01'
      order by meeting_date desc
      limit 1
    cross_currency: false
    ordered: false
    notes: Both bounds, percent, after the year's last held decision.
  - id: sql-r4-m02
    split: test
    family: module1
    question: How many times did the RBI raise the repo rate in 2022, and by how many basis points in all?
    answerable: true
    gold_sql: |
      select count(*) as hikes, sum(policy_rate_change_bps) as total_bps
      from policy_meetings
      where bank = 'RBI' and status = 'held' and policy_rate_change_bps > 0
        and meeting_date >= date '2022-01-01' and meeting_date < date '2023-01-01'
    cross_currency: false
    ordered: false
    notes: Every held decision of 2022 that raised the repo rate (the unscheduled May 2022 one among them), and their sum in basis points.
  - id: sql-r4-m03
    split: test
    family: module1
    question: What was the Nifty 50's close on the day of each RBI decision in 2025?
    answerable: true
    gold_sql: |
      select p.meeting_date, m.value
      from policy_meetings p
      join market_daily m on m.series_key = 'yf.^NSEI' and m.date = p.meeting_date
      where p.bank = 'RBI' and p.status = 'held' and p.meeting_date >= date '2025-01-01' and p.meeting_date < date '2026-01-01'
    cross_currency: false
    ordered: false
    notes: The Nifty 50's end-of-day close dated the decision day, in index points.
  - id: sql-r4-m04
    split: test
    family: module1
    question: How many members voted at the FOMC's December 2024 meeting?
    answerable: true
    gold_sql: |
