  # ---------------------------------------------------------------- round 3 items (dev since round 4): cross-currency
  - id: sql-r3-x01
    split: dev
    family: cross_currency
    question: How do Nestlé India's and Coca-Cola's latest annual revenues compare?
    answerable: true
    gold_sql: |
      select company, currency, revenue
      from (select company, currency, revenue, period_end, max(period_end) over (partition by company) as latest
            from company_financials
            where basis = 'consolidated' and period_kind = 'year' and revenue is not null
              and (nse_symbol = 'NESTLEIND' or ticker = 'KO')) t
      where period_end = latest
    cross_currency: true
    ordered: false
    notes: Each company's latest annual revenue in its own currency, never ranked against the other.
  - id: sql-r3-x02
    split: dev
    family: cross_currency
