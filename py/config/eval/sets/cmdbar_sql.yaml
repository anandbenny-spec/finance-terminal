  # ---------------------------------------------------------------- round 4 test split: calls and guidance
  - id: sql-r4-c01
    split: test
    family: calls
    question: When did ITC hold its Q1 FY27 earnings call?
    answerable: true
    gold_sql: |
      select call_date
      from earnings_calls
      where nse_symbol = 'ITC' and fiscal_quarter = 'Q1 FY27'
    cross_currency: false
    ordered: false
    notes: From the transcript or the call notice.
  - id: sql-r4-c02
    split: test
    family: calls
    question: How many of the Q2 FY27 earnings calls listed were held in November 2026?
    answerable: true
    gold_sql: |
      select count(*) as calls
      from earnings_calls
      where fiscal_quarter = 'Q2 FY27' and call_date >= date '2026-11-01' and call_date < date '2026-12-01'
    cross_currency: false
    ordered: false
    notes: Q2 FY27 calls whose call date falls in November 2026.
  - id: sql-r4-c03
    split: test
    family: calls
    question: Which companies' Q4 FY25 call transcripts could not be read?
    answerable: true
    gold_sql: |
      select company
      from earnings_calls
      where fiscal_quarter = 'Q4 FY25' and transcript_status = 'unreadable'
    cross_currency: false
    ordered: false
    notes: transcript_status unreadable.
  - id: sql-r4-c04
    split: test
    family: calls
    question: On average, how many days after the quarter's end were the Q1 FY27 earnings calls held?
    answerable: true
    gold_sql: |
      select round(avg(call_date - quarter_end), 1) as avg_days
      from earnings_calls
      where fiscal_quarter = 'Q1 FY27' and call_date is not null
    cross_currency: false
    ordered: false
    notes: Calendar days from the quarter's last day to the call date, averaged over the calls with a date; compared at one decimal.
  - id: sql-r4-c05
    split: test
    family: calls
    question: Which companies' Q2 FY27 call transcripts were filed on BSE rather than NSE?
    answerable: true
    gold_sql: |
      select company
      from earnings_calls
      where fiscal_quarter = 'Q2 FY27' and exchange = 'BSE'
    cross_currency: false
    ordered: false
    notes: exchange BSE.
  - id: sql-r4-c06
    split: test
    family: calls
    question: List HDFC Bank's earnings calls with their fiscal quarter and call date.
    answerable: true
    gold_sql: |
      select fiscal_quarter, call_date
      from earnings_calls
      where nse_symbol = 'HDFCBANK'
    cross_currency: false
    ordered: false
