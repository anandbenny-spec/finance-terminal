  - id: sql-r4-c07
    split: test
    family: calls
    question: Which companies held their Q1 FY27 earnings calls on the latest date, and when was it?
    answerable: true
    gold_sql: |
      select company, call_date
      from earnings_calls
      where fiscal_quarter = 'Q1 FY27'
