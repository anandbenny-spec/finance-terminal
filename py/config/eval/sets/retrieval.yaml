# The command bar's retrieval set `retrieval` (Spec 07 §6, N3; Architecture 03 §1.9; job K-02, #581). Written before any gate
# run. K-10 (#587) runs the test split through `cmdbar-gates.yml`; K-06 tunes on the dev split only (Spec 07 N5).
# Pass (fixed in Spec 07 §6): recall within the top 8 of at least 0.85 on the test split (a hit is any returned chunk
# overlapping the item's span), with mean reciprocal rank reported. Retrieval runs as the route does:
# semantic.search_chunks(question embedding, question text, banks => '{fed,rbi}', doc_types => the seven policy types, k => 8).
#
# Fed and RBI policy documents only (Spec 07 N3): no earnings-call item. The seven types: fomc_statement, fomc_minutes,
# fomc_presconf_transcript, mpc_resolution, mpc_minutes, rbi_governor_statement, rbi_presconf_transcript.
#
# Each item:
#   id                    unique across the file
#   split                 test or dev
#   question              as a visitor would type it
#   bank                  fed or rbi (the document's entity slug)
#   doc_type              one of the seven
#   event_slug            the meeting the document belongs to; with doc_type it names one published document
#   spans                 (round 2 items, K-06's option B) instead of char_start and char_end: a list of [start, end]
#                         pairs, every passage of the document that states the whole answer
#   char_start, char_end  the expected passage in that document's text: Unicode code points, end exclusive (core.chunk's
#                         offsets). The span covers the words that answer the question, so any chunk holding them counts
#   notes                 what the passage says, in our words (no text from the document)
#
# The spans were found on dev's published documents on 16 Nov 2026 (read-only connector) and point into the current version
# of each document; a document's text is fixed once chunked (CLAUDE.md §3), so a new version is a new document and its item
# is re-pointed by a later change to this file. The document is named by meeting and type rather than by core.document's
# external_key, which for RBI's documents is a path on RBI's site (CLAUDE.md §1: never link to RBI's pages); the pair is unique
# among published documents (checked on dev). No document text is stored here: only the questions, which are ours.

