# NSE (and BSE's equity segment, which shares its holidays) trading calendar, read by ft/calendars.py (Spec 02A §4; 2A-03).
# Per year: `source` (the year-start Capital Market holiday circular), `holidays` (weekday holidays only: Saturdays and
# Sundays are closed by rule; amendments and ad-hoc closures are included, with their own circular in `source`),
# `special_sessions` (kind muhurat | budget | special | dr, with the open and close times in IST). A special session on a
# date makes it a trading session even on a weekend or on a day the holiday list also names (Diwali Laxmi Pujan).
# A year absent here is not covered, and asking about it raises: 2027 is absent because NSE had not published its 2027
# circular by 27 Oct 2026 (add it with the circular, in December). Anand reviews each December.
# Notes: 13 Feb 2019 (Wednesday) is a normal session in every NSE circular read; nothing explains why Yahoo's ^NSEI lacks
# it (a Yahoo gap is likely). Muhurat 2020 and 2022, the Budget-day 2020 session and the 2024 Saturday sessions are cited
# from F&O, commodity, clearing or Member Service Department circulars because no Capital Market circular was found; the
# 2026 list is cited from NSE/FAOP/71777 (the F&O copy of the same list; NSE/CMTR/71775 was unreadable). 2024-01-20,
# 2024-03-02 and 2024-05-18 ran 09:15-10:00 on the primary site and 11:30-12:30 on the DR site: `close` is the DR end.
# 2019-12-02/03 and 2024-09-30/10-01 (live trading from the DR site, normal hours) are ordinary sessions, not listed.
