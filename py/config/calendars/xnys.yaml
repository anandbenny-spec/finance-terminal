# NYSE trading calendar, read by ft/calendars.py (Spec 02A §4; 2A-03). Full-day closures and 1:00 pm ET early closes,
# from NYSE Group's holiday calendar releases (ir.theice.com, Business Wire) and nyse.com/trade/hours-calendars
# (2026-2028), read 27 Oct 2026. Saturday holidays are observed on Friday, Sunday ones on Monday; New Year's Day on a
# Saturday is not observed. 9 Jan 2025 (National Day of Mourning for President Carter) is the one ad-hoc closure found
# for 2019-2027. The 2019-2020 entries rest on the 2018 release only. Anand reviews each December.
# Source keys used in each year's `source`:
#   S1 https://ir.theice.com/press/news-details/2018/NYSE-Group-Announces-2019-2020-and-2021-Holiday-and-Early-Closings-Calendar/default.aspx
#   S2 https://www.businesswire.com/news/home/20201228005203/en/NYSE-Group-Announces-2021-2022-and-2023-Holiday-and-Early-Closings-Calendar
#   S3 https://www.businesswire.com/news/home/20211227005062/en/NYSE-Group-Announces-2022-2023-and-2024-Holiday-and-Early-Closings-Calendar
#   S4 https://ir.theice.com/press/news-details/2024/NYSE-Group-Announces-2025-2026-and-2027-Holiday-and-Early-Closings-Calendar/default.aspx
#   S5 NYSE Group release of 23 Dec 2025 (2026-2027-2028), ir.theice.com
#   S5b https://www.nyse.com/trade/hours-calendars (2026-2028)
#   S6 ICE notice of 30 Dec 2024 closing the markets on 9 Jan 2025 (ir.theice.com)
