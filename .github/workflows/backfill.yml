# Architecture 02 §1.1. Runs only the tasks that are due in this workflow.
name: backfill
on:
  workflow_dispatch:
    inputs:
      task:
        required: true
        type: string
      since:
        description: First date, YYYY-MM-DD
        required: true
        type: string
        default: '2019-01-01'
      until:
        description: Last date (blank = today)
        required: false
        type: string
concurrency:
  group: jobs-backfill
  cancel-in-progress: false
permissions:
  contents: read
defaults:
  run:
    working-directory: py
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884   # v10.3.0, pinned by SHA (setup-uv publishes no v8+ major tags)
        with:
          enable-cache: true
          cache-dependency-glob: py/uv.lock
      - run: uv sync --locked --extra jobs
      - name: Run
        run: uv run --locked python -m ft.jobs.run --workflow backfill --task "$INPUT_TASK" --since "$INPUT_SINCE" --until "$INPUT_UNTIL" --runner github --github-run-id ${{ github.run_id }} --git-sha ${{ github.sha }}
        env:
          # inputs go through the environment, never pasted into the script (injection)
          INPUT_TASK: ${{ inputs.task }}
          INPUT_SINCE: ${{ inputs.since }}
          INPUT_UNTIL: ${{ inputs.until }}
          JOB_DATABASE_URL: ${{ secrets.JOB_DATABASE_URL }}
          STORAGE_ENDPOINT: ${{ secrets.STORAGE_ENDPOINT }}
          STORAGE_BUCKET: ${{ secrets.STORAGE_BUCKET }}
          STORAGE_ACCESS_KEY_ID: ${{ secrets.STORAGE_ACCESS_KEY_ID }}
          STORAGE_SECRET_ACCESS_KEY: ${{ secrets.STORAGE_SECRET_ACCESS_KEY }}
          STORAGE_REGION: ${{ secrets.STORAGE_REGION }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          VOYAGE_API_KEY: ${{ secrets.VOYAGE_API_KEY }}
