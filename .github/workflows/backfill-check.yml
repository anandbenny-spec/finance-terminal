# The backfill re-run check (Prompt 01 B8, part 1; ft/jobs/backfill_check.py): re-runs each data task's backfill on a
# project where it's loaded, then checks the runs wrote no new raw objects, documents or AI requests, and reads back
# every raw file hash-verified. Manual only. Dev runs are approved on issue #17 (no AI spend: none of the four data
# tasks calls a model); production needs Anand's OK. It shares backfill.yml's concurrency group, so the two never
# overlap.
name: backfill-check
on:
  workflow_dispatch:
    inputs:
      tasks:
        description: Comma-separated task keys
        required: true
        type: string
        default: 'policy.calendar,policy.market_series,policy.fed_documents,policy.rbi_documents'
      since:
        description: First date, YYYY-MM-DD
        required: true
        type: string
        default: '2019-01-01'
      until:
        description: Last date (blank = today)
        required: false
        type: string
      verify_only:
        description: Only read back every raw file (no backfill runs)
        type: boolean
        default: false
      target:
        description: Project to run against
        type: choice
        options: [dev, production]
        default: dev
concurrency:
  group: jobs-backfill
  cancel-in-progress: false
permissions:
  contents: read
defaults:
  run:
    working-directory: py
jobs:
  run:
    runs-on: ubuntu-24.04   # pinned: ubuntu-latest moves to Ubuntu 26 from 19 Oct 2026; the audit's G1/S1 ran on 24.04
    timeout-minutes: 300
    env:
      # Same rule as the job workflows (GitHub issue #2, item 1): dev unless production is chosen; a missing DEV_
      # secret leaves the variable empty (the check then stops), never falling back to production's.
      FT_TARGET: ${{ inputs.target == 'production' && 'production' || 'dev' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1, pinned by SHA
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884   # v10.3.0, pinned by SHA (setup-uv publishes no v8+ major tags)
        with:
          enable-cache: true
          cache-dependency-glob: py/uv.lock
      - run: uv sync --locked --extra jobs
      - name: Check
        run: |
          set -- --tasks "$INPUT_TASKS" --since "$INPUT_SINCE" --until "$INPUT_UNTIL" --target "$FT_TARGET" \
                 --runner github --github-run-id "$GITHUB_RUN_ID" --git-sha "$GITHUB_SHA"
          [ "$INPUT_VERIFY_ONLY" = "true" ] && set -- "$@" --verify-only
          uv run --locked python -m ft.jobs.backfill_check "$@"
        env:
          # inputs go through the environment, never pasted into the script (injection)
          INPUT_TASKS: ${{ inputs.tasks }}
          INPUT_SINCE: ${{ inputs.since }}
          INPUT_UNTIL: ${{ inputs.until }}
          INPUT_VERIFY_ONLY: ${{ inputs.verify_only }}
          JOB_DATABASE_URL: ${{ env.FT_TARGET == 'production' && secrets.JOB_DATABASE_URL || env.FT_TARGET == 'dev' && secrets.DEV_JOB_DATABASE_URL || '' }}
          STORAGE_ENDPOINT: ${{ env.FT_TARGET == 'production' && secrets.STORAGE_ENDPOINT || env.FT_TARGET == 'dev' && secrets.DEV_STORAGE_ENDPOINT || '' }}
          STORAGE_ACCESS_KEY_ID: ${{ env.FT_TARGET == 'production' && secrets.STORAGE_ACCESS_KEY_ID || env.FT_TARGET == 'dev' && secrets.DEV_STORAGE_ACCESS_KEY_ID || '' }}
          STORAGE_SECRET_ACCESS_KEY: ${{ env.FT_TARGET == 'production' && secrets.STORAGE_SECRET_ACCESS_KEY || env.FT_TARGET == 'dev' && secrets.DEV_STORAGE_SECRET_ACCESS_KEY || '' }}
          STORAGE_BUCKET: ${{ secrets.STORAGE_BUCKET }}
          STORAGE_REGION: ${{ secrets.STORAGE_REGION }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
