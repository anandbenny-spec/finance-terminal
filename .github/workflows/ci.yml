# Lint, the 70 SQL tests and the Python tests on every push and pull request (Architecture 04 §1.5).
name: ci
on:
  push:
    branches: [main]
  pull_request: {}
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_HOST_AUTH_METHOD: trust      # throwaway test database only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884   # v10.3.0, pinned by SHA (setup-uv publishes no v8+ major tags)
        with:
          enable-cache: true
          cache-dependency-glob: py/uv.lock
      - name: Lint
        working-directory: py
        run: uv run --locked ruff check src tests
      - name: Migrations and SQL tests
        env:
          PGHOST: localhost
          PGPORT: '5432'
        run: supabase/tests/run_all.sh
      - name: Python tests
        working-directory: py
        env:
          TEST_PG_CONNINFO: host=localhost port=5432 dbname=ft
        run: uv run --locked pytest -q
