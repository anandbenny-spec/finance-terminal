# Lint, the SQL tests, the Python tests and the web/ checks on every push and pull request (Architecture 04 §1.5,
# §1.6 item 4). Failing tests and the counts are written as annotations, which Claude reads through the API
# (CLAUDE.md §6); the test job fails if either count falls below main's (CLAUDE.md §2).
name: ci
on:
  push:
    branches: [main]
  pull_request: {}
  workflow_dispatch: {}
concurrency:
  # A run on main is never cancelled: its counts are the next commit's baseline.
  group: ci-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  secrets:
    # Secret scan of the full history on every push (CLAUDE.md §4). Claude's cloud clones and Anand's Mac also run
    # the same scan as a pre-commit hook; this is the check that can't be skipped.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GITLEAKS_VERSION: 8.24.2
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install gitleaks (release archive, checksum checked)
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          tgz="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLO "$base/$tgz"
          curl -fsSL "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt" -o checksums.txt
          grep " $tgz\$" checksums.txt | sha256sum --check -
          tar xzf "$tgz" gitleaks
      - name: Scan the full history
        run: ./gitleaks git --config .gitleaks.toml --redact --no-banner --verbose .
  test:
    runs-on: ubuntu-24.04   # pinned: ubuntu-latest moves to Ubuntu 26 from 19 Oct 2026; the audit's G1/S1 ran on 24.04
    timeout-minutes: 15
    permissions:
      contents: read        # checkout; the baseline commit (parent or merge base)
      checks: read          # main's counts, from its test job's annotations
      pull-requests: read   # who added counts-drop-approved
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_HOST_AUTH_METHOD: trust      # throwaway test database only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884   # v10.3.0, pinned by SHA (setup-uv publishes no v8+ major tags)
        with:
          enable-cache: true
          cache-dependency-glob: py/uv.lock
      - name: Lint
        working-directory: py
        run: uv run --locked ruff check src tests
      - name: Migrations and SQL tests
        id: sql
        env:
          PGHOST: localhost
          PGPORT: '5432'
        run: |
          supabase/tests/run_all.sh 2>&1 | tee sql.log
          status=${PIPESTATUS[0]}
          grep -E '^(FAIL|migration failed)' sql.log | head -10 | sed 's/^/::error title=SQL test::/'
          grep -E '^psql:.*ERROR' sql.log | head -3 | sed 's/^/::error title=SQL error::/'
          p=$(grep -oE 'passed [0-9]+' sql.log | awk '{s+=$2} END {print s+0}')
          f=$(grep -oE 'failed [0-9]+' sql.log | awk '{s+=$2} END {print s+0}')
          echo "::notice title=SQL tests::passed $p, failed $f"
          echo "summary=passed $p, failed $f" >> "$GITHUB_OUTPUT"
          exit "$status"
      - name: Python tests
        id: pytest
        working-directory: py
        env:
          TEST_PG_CONNINFO: host=localhost port=5432 dbname=ft
        # With the jobs extra, as the job workflows install it: the document engine's tests need lxml and pypdf (B2).
        run: |
          uv run --locked --extra jobs pytest -q -rfE 2>&1 | tee pytest.log
          status=${PIPESTATUS[0]}
          grep -E '^(FAILED|ERROR) ' pytest.log | head -10 | sed 's/^/::error title=pytest::/'
          echo "::notice title=pytest::$(tail -1 pytest.log)"
          echo "summary=$(tail -1 pytest.log)" >> "$GITHUB_OUTPUT"
          exit "$status"
      - name: Counts against main
        # CLAUDE.md §2: neither pass count may fall below main's, read from the annotations of ci's test job on the
        # pull request's base commit (on a push to main, the parent). No baseline fails too. The only override is
        # the counts-drop-approved label, added by Anand himself (CLAUDE.md §7). Logic and tests: ft/ci_counts.py.
        working-directory: py
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SQL_SUMMARY: ${{ steps.sql.outputs.summary }}
          PYTEST_SUMMARY: ${{ steps.pytest.outputs.summary }}
        run: uv run --locked python -m ft.ci_counts
  web:
    # The front end (Architecture 04 §1.6 item 4; added in A0, 23 Oct 2026): lint, typecheck, unit tests and the
    # production build, on the Node version web/package.json's engines field names. setup-node's problem matchers
    # annotate ESLint and tsc errors; the steps below add the failing tests and the counts.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: web/package.json
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install from the lock file
        run: |
          echo "::notice title=web toolchain::node $(node -v), npm $(npm -v)"
          npm ci --no-audit --no-fund
      - name: Lint
        run: |
          npm run lint 2>&1 | tee lint.log
          status=${PIPESTATUS[0]}
          echo "::notice title=eslint::$(grep -E '^✖ [0-9]+ problem' lint.log || echo 'no problems')"
          exit "$status"
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: |
          npm test 2>&1 | tee test.log
          status=${PIPESTATUS[0]}
          sed -i 's/\x1b\[[0-9;]*m//g' test.log   # Vitest colours its output on GitHub's runners
          grep -E '^ +(FAIL|×) ' test.log | head -10 | sed 's/^ */::error title=vitest::/'
          echo "::notice title=vitest::$(grep -E '^ +Tests +' test.log | tr -s ' ' | sed 's/^ //')"
          exit "$status"
      - name: Build
        run: |
          npm run build 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          grep -E '^(Error|Type error|Failed to compile)' build.log | head -5 | sed 's/^/::error title=next build::/'
          echo "::notice title=next build::$([ "$status" = 0 ] && echo "built $(grep -cE '^[├└┌] ' build.log) routes" || echo failed)"
          exit "$status"
