# Architecture 02 §1.1. Runs only the tasks that are due in this workflow.
name: weekly
on:
  schedule:
    - cron: '23 9 * * 0'
      timezone: 'Asia/Kolkata'
  workflow_dispatch:
    inputs:
      target:
        description: Project to run against (a scheduled run always uses production)
        type: choice
        options: [dev, production]
        default: dev
concurrency:
  group: jobs-weekly
  cancel-in-progress: false
permissions:
  contents: read
defaults:
  run:
    working-directory: py
jobs:
  run:
    # Issue #69: a scheduled run does nothing unless the repository variable PRODUCTION_SCHEDULES is 'on'
    # (unset = off), so the workflow can stay enabled for manual dev runs while production's schedules stay off.
    # Manual runs are unchanged. py/tests/test_workflows.py fails CI for a scheduled workflow without this guard.
    if: github.event_name != 'schedule' || vars.PRODUCTION_SCHEDULES == 'on'
    runs-on: ubuntu-24.04   # pinned: ubuntu-latest moves to Ubuntu 26 from 19 Oct 2026; the audit's G1/S1 ran on 24.04
    timeout-minutes: 120
    env:
      # GitHub issue #2, item 1: a scheduled run always targets production; a manual run targets dev unless
      # production is chosen. Production's credentials enter the environment only on a production run, and a
      # missing DEV_ secret leaves its variable empty (the run then stops), never falling back to production's.
      FT_TARGET: ${{ (github.event_name == 'schedule' || inputs.target == 'production') && 'production' || 'dev' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1, pinned by SHA
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884   # v10.3.0, pinned by SHA (setup-uv publishes no v8+ major tags)
        with:
          enable-cache: true
          cache-dependency-glob: py/uv.lock
      - run: uv sync --locked --extra jobs
      - name: Run
        run: uv run --locked python -m ft.jobs.run --workflow weekly --target "$FT_TARGET" --runner github --github-run-id ${{ github.run_id }} --git-sha ${{ github.sha }}
        env:
          JOB_DATABASE_URL: ${{ env.FT_TARGET == 'production' && secrets.JOB_DATABASE_URL || env.FT_TARGET == 'dev' && secrets.DEV_JOB_DATABASE_URL || '' }}
          STORAGE_ENDPOINT: ${{ env.FT_TARGET == 'production' && secrets.STORAGE_ENDPOINT || env.FT_TARGET == 'dev' && secrets.DEV_STORAGE_ENDPOINT || '' }}
          STORAGE_ACCESS_KEY_ID: ${{ env.FT_TARGET == 'production' && secrets.STORAGE_ACCESS_KEY_ID || env.FT_TARGET == 'dev' && secrets.DEV_STORAGE_ACCESS_KEY_ID || '' }}
          STORAGE_SECRET_ACCESS_KEY: ${{ env.FT_TARGET == 'production' && secrets.STORAGE_SECRET_ACCESS_KEY || env.FT_TARGET == 'dev' && secrets.DEV_STORAGE_SECRET_ACCESS_KEY || '' }}
          STORAGE_BUCKET: ${{ secrets.STORAGE_BUCKET }}
          STORAGE_REGION: ${{ secrets.STORAGE_REGION }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          VOYAGE_API_KEY: ${{ secrets.VOYAGE_API_KEY }}
      # #263: after a successful production run, load the main pages a few times so the first real visitor gets the data
      # the run just stored (ops/warm-site.sh). It reads public pages and takes no secret.
      - name: Warm the site
        if: success() && env.FT_TARGET == 'production'
        continue-on-error: true
        run: bash "$GITHUB_WORKSPACE/ops/warm-site.sh"
      # #364: the dead-man check for `weekly`. A production run that succeeded pings its own Healthchecks check; one that
      # failed pings /fail, so a failed weekly emails the same day. Both skip quietly with no secret; a manual dev run
      # never pings. The success ping is the last step, after the warm-up (py/tests/test_health.py).
      - name: Ping the weekly dead-man check
        if: success() && env.FT_TARGET == 'production'
        run: |
          if [ -z "$HEALTHCHECKS_WEEKLY_PING_URL" ]; then echo "HEALTHCHECKS_WEEKLY_PING_URL is not set: no ping"; exit 0; fi
          curl -fsS -m 10 --retry 3 "$HEALTHCHECKS_WEEKLY_PING_URL" > /dev/null
        env:
          HEALTHCHECKS_WEEKLY_PING_URL: ${{ secrets.HEALTHCHECKS_WEEKLY_PING_URL }}
      - name: Ping the weekly dead-man check (failure)
        if: failure() && env.FT_TARGET == 'production'
        run: |
          if [ -z "$HEALTHCHECKS_WEEKLY_PING_URL" ]; then echo "HEALTHCHECKS_WEEKLY_PING_URL is not set: no ping"; exit 0; fi
          curl -fsS -m 10 --retry 3 "$HEALTHCHECKS_WEEKLY_PING_URL/fail" > /dev/null
        env:
          HEALTHCHECKS_WEEKLY_PING_URL: ${{ secrets.HEALTHCHECKS_WEEKLY_PING_URL }}
